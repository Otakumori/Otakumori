name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches:
      - main
      - develop
      - 'cursor/**'
      - 'fix/**'

env:
  PNPM_VERSION: '10.15.1'

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          check-latest: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Mini-Games QA Validation
        run: pnpm run mini-games:qa

      - name: Production Asset Registry Validation
        run: pnpm run assets:production:validate

      - name: Run unit tests
        run: pnpm run test

  build:
    name: Build & Bundle Analysis
    runs-on: ubuntu-latest
    needs: test
    env:
      DATABASE_URL: postgresql://ci_placeholder:ci_placeholder@localhost:5432/otakumori_ci
      DIRECT_URL: postgresql://ci_placeholder:ci_placeholder@localhost:5432/otakumori_ci
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_ZTJlLWNpLmNsZXJrLmFjY291bnRzLmRldiQ
      CLERK_PROXY_URL: ''
      NEXT_PUBLIC_CLERK_PROXY_URL: ''
      PRINTIFY_API_KEY: ci_placeholder
      PRINTIFY_SHOP_ID: ci_placeholder
      UPSTASH_REDIS_REST_URL: https://ci-placeholder.invalid
      UPSTASH_REDIS_REST_TOKEN: ci_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
      NEXT_PUBLIC_FEATURE_HERO: '1'
      NEXT_PUBLIC_FEATURE_PETALS_INTERACTIVE: '1'
      NEXT_PUBLIC_FEATURE_SHOP: '1'
      NEXT_PUBLIC_FEATURE_MINIGAMES: 'on'
      NEXT_PUBLIC_FEATURE_BLOG: '1'
      NEXT_PUBLIC_FEATURE_SOAPSTONES: '1'
      NEXT_PUBLIC_LIVE_DATA: '0'
      NEXT_PUBLIC_PROBE_MODE: '1'
      # Both optimized build passes must produce the same localhost-only QA artifact.
      # next.config.mjs refuses this adapter whenever VERCEL=1.
      OTM_VISUAL_QA_AUTH: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          check-latest: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Analyze bundle size
        run: |
          pnpm run build -- --analyze
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: .next/
          include-hidden-files: true
          retention-days: 1

  lighthouse:
    name: Lighthouse Performance
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          check-latest: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: .next/

      - name: Start Next.js server
        run: |
          pnpm run start &
          sleep 30
        env:
          PORT: 3000
          LIGHTHOUSE_CI: '1'
          DATABASE_URL: postgresql://ci_placeholder:ci_placeholder@localhost:5432/otakumori_ci
          DIRECT_URL: postgresql://ci_placeholder:ci_placeholder@localhost:5432/otakumori_ci
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          CLERK_SECRET_KEY: sk_test_ci_placeholder
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_ZTJlLWNpLmNsZXJrLmFjY291bnRzLmRldiQ
          CLERK_PROXY_URL: ''
          NEXT_PUBLIC_CLERK_PROXY_URL: ''
          PRINTIFY_API_KEY: ci_placeholder
          PRINTIFY_SHOP_ID: ci_placeholder
          UPSTASH_REDIS_REST_URL: https://ci-placeholder.invalid
          UPSTASH_REDIS_REST_TOKEN: ci_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
          NEXT_PUBLIC_FEATURE_HERO: '1'
          NEXT_PUBLIC_FEATURE_PETALS_INTERACTIVE: '1'
          NEXT_PUBLIC_FEATURE_SHOP: '1'
          NEXT_PUBLIC_FEATURE_MINIGAMES: 'on'
          NEXT_PUBLIC_FEATURE_BLOG: '1'
          NEXT_PUBLIC_FEATURE_SOAPSTONES: '1'
          NEXT_PUBLIC_LIVE_DATA: '0'
          NEXT_PUBLIC_PROBE_MODE: '1'

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: './lighthouserc.cjs'
          uploadArtifacts: false
          temporaryPublicStorage: true

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse_results_${{ github.run_id }}_${{ github.run_attempt }}
          path: .lighthouseci/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

  e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: otm_e2e
          POSTGRES_PASSWORD: ci_only_pwd
          POSTGRES_DB: otm_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U otm_e2e -d otm_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://otm_e2e:ci_only_pwd@127.0.0.1:5432/otm_e2e?schema=public
      DIRECT_URL: postgresql://otm_e2e:ci_only_pwd@127.0.0.1:5432/otm_e2e?schema=public

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          check-latest: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate engine-bearing Prisma client
        run: pnpm exec prisma generate --schema prisma/schema.prisma

      - name: Verify disposable E2E database
        shell: bash
        run: |
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const client = new PrismaClient();
          async function verify() {
            const rows = await client.$queryRawUnsafe('SELECT current_database() AS db');
            if (rows?.[0]?.db !== 'otm_e2e') {
              throw new Error('Unexpected E2E database identity');
            }
            console.log('Disposable E2E PostgreSQL identity and connectivity verified');
          }
          verify()
            .catch(() => {
              console.error('Disposable E2E PostgreSQL connectivity or identity failed');
              process.exitCode = 1;
            })
            .finally(async () => { await client.$disconnect(); });
          NODE

      - name: Apply schema to disposable E2E database
        run: pnpm exec prisma db push --schema prisma/schema.prisma --skip-generate

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: .next/

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Start Next.js server
        run: |
          pnpm run start > /tmp/otm-next.log 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/api/health > /dev/null; then
              echo "Next.js readiness and database connectivity verified"
              exit 0
            fi
            sleep 2
          done
          echo "Next.js did not become database-ready"
          tail -n 50 /tmp/otm-next.log
          exit 1
        env:
          PORT: 3000
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          CLERK_SECRET_KEY: sk_test_ci_placeholder
          PRINTIFY_API_KEY: ci_printify_disabled_placeholder
          PRINTIFY_SHOP_ID: ci_printify_disabled_shop
          PRINTIFY_API_URL: https://ci-placeholder.invalid/v1
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_ZTJlLWNpLmNsZXJrLmFjY291bnRzLmRldiQ
          CLERK_PROXY_URL: ''
          NEXT_PUBLIC_CLERK_PROXY_URL: ''
          UPSTASH_REDIS_REST_URL: https://ci-placeholder.invalid
          UPSTASH_REDIS_REST_TOKEN: ci_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
          NEXT_PUBLIC_FEATURE_HERO: '1'
          NEXT_PUBLIC_FEATURE_PETALS_INTERACTIVE: '1'
          NEXT_PUBLIC_FEATURE_SHOP: '1'
          NEXT_PUBLIC_FEATURE_MINIGAMES: 'on'
          NEXT_PUBLIC_FEATURE_BLOG: '1'
          NEXT_PUBLIC_FEATURE_SOAPSTONES: '1'
          NEXT_PUBLIC_LIVE_DATA: '0'
          NEXT_PUBLIC_PROBE_MODE: '1'
          OTM_VISUAL_QA_AUTH: '1'

      - name: Run Playwright tests
        run: pnpm exec playwright test
        env:
          BASE_URL: http://localhost:3000
          # Keep test expectations aligned with the localhost-only server adapter.
          OTM_VISUAL_QA_AUTH: '1'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Playwright traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          check-latest: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        # Critical production advisories are release-blocking. Lower-severity
        # debt remains visible in the audit output and is tracked separately.
        run: pnpm audit --prod --audit-level critical

      - name: Run dependency check
        run: pnpm run check-deps
        continue-on-error: true
