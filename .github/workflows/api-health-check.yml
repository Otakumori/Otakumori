name: API Health Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches:
      - main
      - develop
      - 'cursor/**'
      - 'fix/**'

env:
  PNPM_VERSION: '10.15.1'
  SKIP_ENV_VALIDATION: '1'

jobs:
  api-health-check:
    runs-on: ubuntu-latest
    # Pull requests exercise a real, disposable local PostgreSQL service.
    # Only trusted push events use the existing secret-backed database and providers.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: otm_ci
          POSTGRES_PASSWORD: ci_only_pwd
          POSTGRES_DB: otm_ci_health
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U otm_ci -d otm_ci_health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: ${{ github.event_name == 'pull_request' && 'postgresql://otm_ci:ci_only_pwd@127.0.0.1:5432/otm_ci_health?schema=public' || secrets.DATABASE_URL }}
      DIRECT_URL: ${{ github.event_name == 'pull_request' && 'postgresql://otm_ci:ci_only_pwd@127.0.0.1:5432/otm_ci_health?schema=public' || secrets.DIRECT_URL }}
      CLERK_SECRET_KEY: ${{ github.event_name == 'pull_request' && 'sk_test_ci_no_real_provider_access' || secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ github.event_name == 'pull_request' && 'pk_test_ci00000000000000000000000' || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      STRIPE_SECRET_KEY: ${{ github.event_name == 'pull_request' && 'sk_test_ci_no_real_provider_access' || secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ github.event_name == 'pull_request' && 'whsec_ci_no_real_provider_access' || secrets.STRIPE_WEBHOOK_SECRET }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ github.event_name == 'pull_request' && 'pk_test_ci_no_real_provider_access' || secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      PRINTIFY_API_KEY: ${{ github.event_name == 'pull_request' && 'ci_no_provider_access' || secrets.PRINTIFY_API_KEY }}
      PRINTIFY_SHOP_ID: ${{ github.event_name == 'pull_request' && 'ci_no_provider_access' || secrets.PRINTIFY_SHOP_ID }}
      UPSTASH_REDIS_REST_URL: ${{ github.event_name == 'pull_request' && 'https://ci-placeholder.upstash.io' || secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ github.event_name == 'pull_request' && 'ci_no_network_calls' || secrets.UPSTASH_REDIS_REST_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Ensure DIRECT_URL for Prisma
        run: |
          if [ -z "${DIRECT_URL}" ] && [ -n "${DATABASE_URL}" ]; then
            echo "DIRECT_URL=${DATABASE_URL}" >> $GITHUB_ENV
          fi

      - name: Configure CI env placeholders
        run: |
          if [ -z "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}" ]; then
            echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_ci00000000000000000000000" >> $GITHUB_ENV
          fi
          if [ -z "${UPSTASH_REDIS_REST_URL}" ]; then
            echo "UPSTASH_REDIS_REST_URL=https://ci-placeholder.upstash.io" >> $GITHUB_ENV
          fi
          if [ -z "${UPSTASH_REDIS_REST_TOKEN}" ]; then
            echo "UPSTASH_REDIS_REST_TOKEN=ci_upstash_placeholder_token" >> $GITHUB_ENV
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          check-latest: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Verify isolated pull-request database before build
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const client = new PrismaClient();
          async function verify() {
            const rows = await client.$queryRawUnsafe('SELECT current_database() AS db');
            if (rows?.[0]?.db !== 'otm_ci_health') {
              throw new Error('Unexpected database identity in pull-request health test');
            }
            console.log('Pull-request PostgreSQL identity and connectivity verified');
          }
          verify()
            .catch(() => {
              console.error('Isolated CI PostgreSQL connectivity or identity failed');
              process.exitCode = 1;
            })
            .finally(async () => { await client.$disconnect(); });
          NODE

      - name: Build project
        run: pnpm run build

      - name: Start production server
        run: |
          pnpm start &
          sleep 20
        env:
          PORT: '3000'

      - name: Run API health check
        run: pnpm run api:health
