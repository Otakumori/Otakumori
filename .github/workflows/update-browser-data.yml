name: Update browser compatibility data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 1 * *'
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-browser-data.yml

permissions:
  contents: write

jobs:
  update-browser-data:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          check-latest: true

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh browser data
        run: |
          pnpm dlx update-browserslist-db@latest
          pnpm up -D baseline-browser-mapping@latest caniuse-lite@latest browserslist@latest

      - name: Verify lockfile and build
        env:
          DATABASE_URL: postgresql://ci_placeholder:ci_placeholder@localhost:5432/otakumori_ci
          DIRECT_URL: postgresql://ci_placeholder:ci_placeholder@localhost:5432/otakumori_ci
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          CLERK_SECRET_KEY: sk_test_ci_placeholder
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_ZTJlLWNpLmNsZXJrLmFjY291bnRzLmRldiQ
          CLERK_PROXY_URL: ''
          NEXT_PUBLIC_CLERK_PROXY_URL: ''
          PRINTIFY_API_KEY: ci_placeholder
          PRINTIFY_SHOP_ID: ci_placeholder
          UPSTASH_REDIS_REST_URL: https://ci-placeholder.invalid
          UPSTASH_REDIS_REST_TOKEN: ci_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
          NEXT_PUBLIC_FEATURE_HERO: '1'
          NEXT_PUBLIC_FEATURE_PETALS_INTERACTIVE: '1'
          NEXT_PUBLIC_FEATURE_SHOP: '1'
          NEXT_PUBLIC_FEATURE_MINIGAMES: 'on'
          NEXT_PUBLIC_FEATURE_BLOG: '1'
          NEXT_PUBLIC_FEATURE_SOAPSTONES: '1'
          NEXT_PUBLIC_LIVE_DATA: '0'
          NEXT_PUBLIC_PROBE_MODE: '1'
        run: |
          pnpm install --frozen-lockfile
          pnpm prisma generate
          pnpm build

      - name: Commit browser data refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Browser compatibility data is already current."
          else
            git commit -m "chore(deps): refresh browser compatibility data"
            git push
          fi
