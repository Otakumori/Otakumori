<style>
:root{--bg:#08090d;--panel:#101218;--panel2:#151821;--line:#2a2f3b;--text:#f5f2ec;--muted:#9ca3b2;--pink:#e679bb;--gold:#dfb676}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}button,select,input{font:inherit}button{color:var(--text)}
#app{height:100%;display:grid;grid-template-rows:52px minmax(0,1fr) 58px;background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line);background:#090a0e;z-index:5}.brand{font-family:Georgia,serif;letter-spacing:.08em}.brand b{color:var(--pink);font-weight:600}.status{font-size:10px;color:var(--muted);text-align:right}
#main{position:relative;min-height:0}#c{width:100%;height:100%;display:block;touch-action:none;background:radial-gradient(circle at 50% 18%,#1a1720 0,#0b0d12 45%,#07080b 100%)}

.charbar{position:absolute;left:10px;bottom:10px;display:flex;gap:6px}.diagnostic{position:absolute;right:10px;bottom:10px;padding:7px 9px;border:1px solid #303542;background:#0b0d12d9;font:10px ui-monospace,SFMono-Regular,monospace;color:#cfd4df;min-width:128px}.diagnostic b{color:var(--gold)}

@media(min-width:920px){#app{grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:52px minmax(0,1fr);grid-template-areas:'head head' 'main sheet'}header{grid-area:head}#main{grid-area:main}nav{position:absolute;left:12px;right:12px;bottom:10px;width:auto;border:1px solid #313743;border-radius:9px;background:#0b0d12e8;padding:4px}#sheet{grid-area:sheet;position:static;transform:none!important;max-height:none;border-left:1px solid var(--line);border-top:0;padding:0 14px 20px;background:#0b0d12}.handle,.sheethead button{display:none}.sheethead{top:0;padding-top:14px}.quick{max-width:none}.charbar{bottom:76px}.diagnostic{bottom:76px}}

<script>
(()=>{

const mat=(c,r=.56,m=.06)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const suitA=mat(0x222631,.45,.18),suitS=mat(0x191c23,.46,.2),skinA=mat(0xd2a08b,.68,.01),skinS=mat(0xa97766,.7,.01),hairA=mat(0x66503f,.72,.02),hairS=mat(0x15161a,.68,.04),markerMat=new THREE.MeshBasicMaterial({color:0xe679bb,transparent:true,opacity:.85});

function limb(parent,skin,suit,pos,upperLen,lowerLen,r,isArm){const u=joint(parent,pos),um=add(new THREE.CapsuleGeometry(r,upperLen,6,12),isArm?skin:suit,u,[0,-upperLen*.52,0]);const l=joint(u,[0,-upperLen-.02,0]),lm=add(new THREE.CapsuleGeometry(r*.9,lowerLen,6,12),isArm?skin:suit,l,[0,-lowerLen*.52,0]);const end=joint(l,[0,-lowerLen-.02,0]);if(isArm)add(new THREE.SphereGeometry(r*1.05,14,10),skin,end,[0,-.035,0],[.8,1.3,.7]);else{const f=add(new THREE.CapsuleGeometry(r*.92,.18,5,10),suit,end,[0,-.06,.06],[.82,1,1.55]);f.rotation.x=Math.PI/2}return{u,l,um,lm,end}}
function avatar(id,sex,x,baseHeight){const root=new THREE.Group();root.position.x=x;scene.add(root);const rig=joint(root),pelvis=joint(rig,[0,1.02,0]),spine=joint(pelvis,[0,.38,0]),chest=joint(spine,[0,.38,0]),neck=joint(chest,[0,.31,0]),head=joint(neck,[0,.18,0]);const skin=sex==='f'?skinA:skinS,suit=sex==='f'?suitA:suitS,hair=sex==='f'?hairA:hairS;const pelvisMesh=add(new THREE.SphereGeometry(.26,24,18),suit,pelvis,[0,0,0],[1.15,.72,.84]),abdomen=add(new THREE.CapsuleGeometry(.2,.38,6,14),suit,spine,[0,.03,0],[.95,1,.72]),torso=add(new THREE.CapsuleGeometry(.26,.34,6,18),suit,chest,[0,.02,0],[sex==='f'?1.05:1.12,1,.72]);const chestL=add(new THREE.SphereGeometry(.15,20,16),suit,chest,[-.13,.02,.16],[1,sex==='f'?.82:.68,sex==='f'?.93:.76]),chestR=add(new THREE.SphereGeometry(.15,20,16),suit,chest,[.13,.02,.16],[1,sex==='f'?.82:.68,sex==='f'?.93:.76]),glL=add(new THREE.SphereGeometry(.17,20,16),suit,pelvis,[-.13,-.03,-.16],[1,1,sex==='f'?1.18:1.05]),glR=add(new THREE.SphereGeometry(.17,20,16),suit,pelvis,[.13,-.03,-.16],[1,1,sex==='f'?1.18:1.05]),belly=add(new THREE.SphereGeometry(.15,18,14),suit,spine,[0,-.03,.14],[1.18,.78,.68]);add(new THREE.SphereGeometry(.19,24,20),skin,head,[0,.02,0],[.9,1.08,.9]);add(new THREE.SphereGeometry(.205,20,16,0,Math.PI*2,0,Math.PI*.75),hair,head,[0,.04,-.01]);const hairRoot=joint(head,[0,.02,-.05]),strands=[];for(let i=0;i<(sex==='f'?8:5);i++){const a=(i/((sex==='f'?8:5)-1)-.5)*1.1,s=joint(hairRoot,[Math.sin(a)*.15,-.1,Math.cos(a)*.02]),len=sex==='f'?(.55+.14*Math.cos(a*2)):.22;add(new THREE.CapsuleGeometry(.025,len,4,8),hair,s,[0,-len*.5,0]);s.rotation.z=-a*.35;strands.push({j:s,s:new Spring()})}
const armL=limb(chest,skin,suit,[-.32,.18,0],.42,.38,.075,true),armR=limb(chest,skin,suit,[.32,.18,0],.42,.38,.075,true),legL=limb(pelvis,skin,suit,[-.14,-.10,0],.56,.53,.105,false),legR=limb(pelvis,skin,suit,[.14,-.10,0],.56,.53,.105,false);armL.u.rotation.z=-.06;armR.u.rotation.z=.06;const markers=[];[[-.13,.02,.18,chest],[.13,.02,.18,chest],[-.13,-.03,-.18,pelvis],[.13,-.03,-.18,pelvis],[0,-.03,.16,spine]].forEach(q=>markers.push(add(new THREE.SphereGeometry(.024,10,8),markerMat,q[3],[q[0],q[1],q[2]])));return{id,sex,root,rig,pelvis,spine,chest,neck,head,pelvisMesh,abdomen,torso,chestL,chestR,glL,glR,belly,armL,armR,legL,legR,strands,markers,baseHeight,prev:0,vel:0,impulse:0,spr:{chest:new Spring(),glute:new Spring(),belly:new Spring(),thigh:new Spring(),arm:new Spring()}}}
const adi=avatar('adi','f',-1.05,1.57),sol=avatar('sol','m',1.05,1.85),avatars=[adi,sol];
function applyShape(a){const s=shape[a.id],scale=a.baseHeight*s.height/(a.sex==='f'?1.57:1.85);a.rig.scale.setScalar(scale);a.torso.scale.x=(a.sex==='f'?1.05:1.12)*s.shoulders*s.fullness;a.torso.scale.z=.72*s.chest*s.fullness;a.chestL.scale.set(s.chest,(a.sex==='f'?.82:.68)*s.chest,(a.sex==='f'?.93:.76)*s.chest);a.chestR.scale.copy(a.chestL.scale);a.abdomen.scale.x=.95*s.waist*s.fullness;a.pelvisMesh.scale.x=1.15*s.hips*s.fullness;a.glL.scale.set(s.hips,s.glutes,(a.sex==='f'?1.18:1.05)*s.glutes);a.glR.scale.copy(a.glL.scale);[a.legL,a.legR].forEach(l=>{l.um.scale.x=l.um.scale.z=s.legs*(.9+.1*s.muscle)*s.fullness;l.lm.scale.x=l.lm.scale.z=s.calves*(.93+.07*s.muscle)});[a.armL,a.armR].forEach(l=>{l.um.scale.x=l.um.scale.z=s.arms*(.9+.1*s.muscle);l.lm.scale.x=l.lm.scale.z=s.arms*(.94+.06*s.muscle)})}
function resetRig(a){[a.pelvis,a.spine,a.chest,a.neck,a.head,a.armL.u,a.armL.l,a.armR.u,a.armR.l,a.legL.u,a.legL.l,a.legR.u,a.legR.l].forEach(j=>j.rotation.set(0,0,0));a.armL.u.rotation.z=-.06;a.armR.u.rotation.z=.06;a.rig.position.set(0,0,0)}

a.rig.position.y+=y;const v=(y-a.prev)/Math.max(dt,.001),acc=(v-a.vel)/Math.max(dt,.001);a.prev=y;a.vel=v;const drive=(-acc*.008*state.gravity+a.impulse)*state.intensity;a.impulse*=Math.exp(-dt*5.5);const k=state.stiffness,d=state.damping,m=state.mass,c=a.spr.chest.step(drive*state.chestPhys,dt,k,d,m),g=a.spr.glute.step(drive*state.glutePhys+Math.sin(cyc*3.4)*.012*state.glutePhys,dt,k*.85,d*.88,m*1.1),b=a.spr.belly.step(drive*state.bellyPhys,dt,k*.75,d*.95,m*1.15),th=a.spr.thigh.step(drive*state.thighPhys,dt,k*.8,d,m*1.25),ar=a.spr.arm.step(drive*state.armPhys,dt,k*.9,d,m*.9);a.chestL.position.y=a.chestR.position.y=.02+c*.1;a.chestL.rotation.x=a.chestR.rotation.x=-c*.35;a.glL.position.y=a.glR.position.y=-.03+g*.08;a.glL.rotation.x=a.glR.rotation.x=g*.28;a.belly.position.y=-.03+b*.06;a.legL.um.scale.z*=1+th*.04;a.legR.um.scale.z*=1+th*.04;a.armL.um.scale.z*=1+ar*.03;a.armR.um.scale.z*=1+ar*.03;a.strands.forEach((q,i)=>{const wind=Math.sin(cyc*1.7+i*.7)*state.wind*.025,target=(-v*.022+wind)*state.hairPhys*state.intensity,h=q.s.step(target,dt,k*.55,d*.7,m*.55);q.j.rotation.x=h*.9;q.j.rotation.z+=h*.26});return {c,g,b,th,ar}}
function visibility(){adi.root.visible=state.view!=='sol';sol.root.visible=state.view!=='adi';adi.root.position.x=state.view==='both'?-1.05:0;sol.root.position.x=state.view==='both'?1.05:0}

function resize(){const w=cv.clientWidth,h=cv.clientHeight;if(renderer.domElement.width!==Math.floor(w*renderer.getPixelRatio())||renderer.domElement.height!==Math.floor(h*renderer.getPixelRatio())){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}}
function frame(now){requestAnimationFrame(frame);resize();const dt=Math.min(.033,(now-last)/1000||.016);last=now;t+=dt;let diag={c:0,g:0,b:0,th:0,ar:0};avatars.forEach(a=>{applyShape(a);diag=motion(a,dt);a.markers.forEach(m=>m.visible=state.markers)});grid.visible=state.grid;const map={chestPhys:['chest/pec','c'],glutePhys:['glutes','g'],bellyPhys:['abdomen','b'],thighPhys:['thighs','th'],armPhys:['upper arms','ar'],hairPhys:['hair','c']},entry=map[state.diag]||map.chestPhys,key=entry[1],sel=state.selected==='sol'?sol:adi,spr=key==='c'?sel.spr.chest:key==='g'?sel.spr.glute:key==='b'?sel.spr.belly:key==='th'?sel.spr.thigh:sel.spr.arm;$('#diagName').textContent=entry[0];$('#diagX').textContent=spr.x.toFixed(3);$('#diagV').textContent=spr.v.toFixed(3);renderer.render(scene,camera)}requestAnimationFrame(frame);

const templates={
body:()=>`<div class="section"><h3>Editing character</h3><div class="twocol"><button class="chip ${state.selected==='adi'?'active':''}" data-select="adi">Adi</button><button class="chip ${state.selected==='sol'?'active':''}" data-select="sol">Sol</button></div></div><div class="section"><h3>Body shape</h3>${['height','shoulders','chest','waist','hips','glutes','legs','calves','arms','muscle','fullness'].map(k=>rowShape(k)).join('')}<button class="action danger" id="resetBody">Reset selected body</button></div>`,
physics:()=>`<div class="section"><h3>Global spring-damper</h3>${rowState('intensity',0,2,.01)}${rowState('stiffness',2,60,.1)}${rowState('damping',0,12,.05)}${rowState('mass',.2,3,.01)}${rowState('gravity',0,2,.01)}${rowState('wind',0,2,.01)}</div><div class="section"><h3>Channels</h3>${['chestPhys','glutePhys','bellyPhys','thighPhys','armPhys','hairPhys'].map(k=>rowState(k,0,2,.01,true)).join('')}</div><div class="twocol"><button class="action primary" id="impulse2">Impulse</button><button class="action" id="natural">Natural preset</button></div>`,
motion:()=>`<div class="section"><h3>Animation</h3><select id="animSel">${['idle','walk','run','crouch','sit','jump','land','apose','tpose','relax'].map(v=>`<option ${state.anim===v?'selected':''} value="${v}">${v.replace('apose','A-pose').replace('tpose','T-pose')}</option>`).join('')}</select>${rowState('speed',0,2,.01)}<label class="tog"><input id="slow" type="checkbox" ${state.slow?'checked':''}>Slow motion 0.25×</label><label class="tog"><input id="loop" type="checkbox" ${state.loop?'checked':''}>Loop</label></div>`,
camera:()=>`<div class="section"><h3>Views</h3><div class="four"><button class="chip" data-cam="front">Front</button><button class="chip" data-cam="three">3/4</button><button class="chip" data-cam="side">Side</button><button class="chip" data-cam="rear">Rear</button></div>${rowCamera()}<button class="action" id="resetCam">Reset camera</button></div>`,
scene:()=>`<div class="section"><h3>Debug display</h3><label class="tog"><input id="wire" type="checkbox" ${state.wire?'checked':''}>Wireframe</label><label class="tog"><input id="markers" type="checkbox" ${state.markers?'checked':''}>Physics markers</label><label class="tog"><input id="grid" type="checkbox" ${state.grid?'checked':''}>Ground grid</label></div><p class="note">Current bodies are procedural fitted-clothing proxies. They exist to validate the control contract before canonical skin-weighted GLBs, corrective morphs, collision proxies and production secondary-motion bones/strands replace them.</p>`,
presets:()=>`<div class="section"><h3>Physics feel</h3><div class="four"><button class="chip" data-pre="soft">Soft</button><button class="chip" data-pre="natural">Natural</button><button class="chip" data-pre="firm">Firm</button><button class="chip" data-pre="heavy">Heavy</button></div></div><div class="section"><h3>Quick actions</h3><div class="twocol"><button class="action primary" id="impulse3">Impulse</button><button class="action danger" id="resetAll">Reset all</button></div></div>`,
spec:()=>`<div class="section"><h3>AvatarSpecV2 draft</h3><p class="note">Exports both body configurations and the current physics state for future integration with <code>@om/avatar</code>.</p><button class="action primary" id="exportSpec">Export JSON</button></div>`};
function label(k){return({height:'Height',shoulders:'Shoulders',chest:'Chest / pecs',waist:'Waist',hips:'Hips',glutes:'Glutes',legs:'Thigh / leg',calves:'Calves',arms:'Arms',muscle:'Muscularity',fullness:'Body fullness',intensity:'Intensity',stiffness:'Stiffness',damping:'Damping',mass:'Mass',gravity:'Gravity response',wind:'Wind',speed:'Playback',chestPhys:'Chest / pec',glutePhys:'Glutes',bellyPhys:'Abdomen',thighPhys:'Thigh tissue',armPhys:'Upper arms',hairPhys:'Hair'})[k]||k}
function rowShape(k){const v=shape[state.selected][k],ranges={height:[.86,1.14,.005],shoulders:[.75,1.45,.01],chest:[.7,1.5,.01],waist:[.68,1.35,.01],hips:[.72,1.5,.01],glutes:[.7,1.6,.01],legs:[.75,1.5,.01],calves:[.75,1.45,.01],arms:[.75,1.45,.01],muscle:[.7,1.5,.01],fullness:[.8,1.25,.01]},r=ranges[k];return `<div class="row"><label>${label(k)}</label><input data-shape="${k}" type="range" min="${r[0]}" max="${r[1]}" step="${r[2]}" value="${v}"><output>${(+v).toFixed(2)}</output></div>`}
function rowState(k,min,max,step,channel=false){const v=state[k];return `<div class="row"><label>${label(k)}</label><input data-state="${k}" ${channel?'data-channel="1"':''} type="range" min="${min}" max="${max}" step="${step}" value="${v}"><output>${(+v).toFixed(2)}</output></div>`}function rowCamera(){return `<div class="row"><label>FOV</label><input id="fov" type="range" min="25" max="75" step="1" value="${camera.fov}"><output>${camera.fov.toFixed(0)}°</output></div>`}
function renderSheet(){const title=state.tab[0].toUpperCase()+state.tab.slice(1);$('#sheetTitle').textContent=title;$('#sheetBody').innerHTML=templates[state.tab]();if(innerWidth<920)$('#sheet').classList.add('open');bindSheet()}
function bindSheet(){$$('[data-select]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.select;renderSheet()});$$('[data-shape]').forEach(i=>i.oninput=()=>{shape[state.selected][i.dataset.shape]=+i.value;i.parentElement.querySelector('output').textContent=(+i.value).toFixed(2)});$$('[data-state]').forEach(i=>i.oninput=()=>{state[i.dataset.state]=+i.value;if(i.dataset.channel)state.diag=i.dataset.state;i.parentElement.querySelector('output').textContent=(+i.value).toFixed(2)});$$('[data-cam]').forEach(b=>b.onclick=()=>cam(b.dataset.cam));const q=id=>$('#'+id);if(q('resetBody'))q('resetBody').onclick=()=>{shape[state.selected]={...shapeDefaults[state.selected]};renderSheet()};if(q('animSel'))q('animSel').onchange=e=>state.anim=e.target.value;if(q('slow'))q('slow').onchange=e=>state.slow=e.target.checked;if(q('loop'))q('loop').onchange=e=>state.loop=e.target.checked;if(q('wire'))q('wire').onchange=e=>{state.wire=e.target.checked;setWire()};if(q('markers'))q('markers').onchange=e=>state.markers=e.target.checked;if(q('grid'))q('grid').onchange=e=>state.grid=e.target.checked;if(q('fov'))q('fov').oninput=e=>{camera.fov=+e.target.value;camera.updateProjectionMatrix();e.target.parentElement.querySelector('output').textContent=e.target.value+'°'};['impulse2','impulse3'].forEach(id=>{if(q(id))q(id).onclick=impulse});if(q('natural'))q('natural').onclick=()=>preset('natural');if(q('resetCam'))q('resetCam').onclick=()=>{yaw=0;pitch=.08;radius=6.5;cameraUpdate()};$$('[data-pre]').forEach(b=>b.onclick=()=>preset(b.dataset.pre));if(q('resetAll'))q('resetAll').onclick=resetAll;if(q('exportSpec'))q('exportSpec').onclick=exportSpec}
function cam(v){if(v==='front'){yaw=0;pitch=.06}else if(v==='rear'){yaw=Math.PI;pitch=.06}else if(v==='side'){yaw=Math.PI/2;pitch=.06}else{yaw=-.65;pitch=.08}radius=6.5;cameraUpdate()}
function impulse(){avatars.forEach(a=>a.impulse+=.9)}function preset(p){const m={soft:[15,2.7,.85],natural:[22,4.2,1],firm:[34,6.4,.85],heavy:[18,6.2,1.6]}[p];state.stiffness=m[0];state.damping=m[1];state.mass=m[2];state.intensity=p==='firm'?.7:p==='soft'?1.05:.85;renderSheet()}
function resetAll(){Object.assign(state,JSON.parse(JSON.stringify(defaults)));shape.adi={...shapeDefaults.adi};shape.sol={...shapeDefaults.sol};visibility();setWire();renderSheet()}
function exportSpec(){const spec={schema:'AvatarSpecV2-draft',rig:'OM_Humanoid_v1',runtimeAsset:'GLB',interop:'VRM',package:'@om/avatar',characters:{adi:{target:'feminine-target-01',heightMeters:adi.baseHeight*shape.adi.height,shape:{...shape.adi}},sol:{target:'sol-masculine-target-01',heightMeters:sol.baseHeight*shape.sol.height,shape:{...shape.sol}}},motion:{animation:state.anim,speed:state.speed,slowMotion:state.slow},secondaryMotion:{solver:'spring-damper-proxy',intensity:state.intensity,stiffness:state.stiffness,damping:state.damping,mass:state.mass,gravityResponse:state.gravity,wind:state.wind,channels:{chestPecs:state.chestPhys,glutes:state.glutePhys,abdomen:state.bellyPhys,thighs:state.thighPhys,upperArms:state.armPhys,hair:state.hairPhys}}};const blob=new Blob([JSON.stringify(spec,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='OM_AvatarSpecV2_physics.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$$('nav button').forEach(b=>b.onclick=()=>{$$('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.tab=b.dataset.tab;renderSheet()});$('#closeSheet').onclick=()=>$('#sheet').classList.remove('open');$$('[data-view]').forEach(b=>b.onclick=()=>{$$('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.view=b.dataset.view;visibility()});$$('.quick [data-cam]').forEach(b=>b.onclick=()=>cam(b.dataset.cam));$('#impulse').onclick=impulse;visibility();renderSheet();
})();
</script>
</body></html>
